name: CI

# Runs on every pull request into main: lint, test, build, and a Terraform plan for dev.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: |
          if [ -d tests ]; then
            python -m pytest
          else
            echo "No tests yet (api/tests is missing), skipping."
          fi

  app:
    name: App (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  terraform:
    name: Terraform (check + plan dev)
    runs-on: ubuntu-latest
    # The dev environment holds the AWS_ROLE_ARN, AWS_REGION and TF_STATE_BUCKET variables.
    environment: dev
    permissions:
      id-token: write # OIDC login to AWS
      contents: read
    env:
      TF_IN_AUTOMATION: "true"
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "^1.10.0"
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive -diff

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Select dev workspace
        run: terraform workspace select -or-create dev

      - name: Validate
        run: terraform validate

      - name: Plan
        # -lock=false: this is a read-only plan, so it never blocks (or is blocked by) a deploy
        run: terraform plan -input=false -lock=false -var-file=envs/dev.tfvars
